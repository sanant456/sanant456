<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
<title id="title">Anant Singh — Final-year Computer Science Student</title>
<desc id="desc">Animated midnight-blue developer banner with softly moving blue light, orbiting nodes, and Anant Singh's developer focus.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111F"/>
    <stop offset=".55" stop-color="#12294A"/>
    <stop offset="1" stop-color="#101B38"/>
  </linearGradient>
  <radialGradient id="light">
    <stop offset="0" stop-color="#3B82F6" stop-opacity=".55"/>
    <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#A5C8FF" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1400" height="390" rx="26" fill="url(#base)"/>
<rect width="1400" height="390" rx="26" fill="url(#grid)"/>
<ellipse cx="1120" cy="190" rx="300" ry="250" fill="url(#light)" filter="url(#blur)">
  <animate attributeName="cx" values="1030;1200;1030" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="165;225;165" dur="7s" repeatCount="indefinite"/>
</ellipse>
<path d="M850 0L1400 390M1040 0L1400 250" stroke="#BFDBFE" stroke-opacity=".10" stroke-width="2"/>
<rect x="76" y="76" width="7" height="238" rx="3.5" fill="#60A5FA"/>
<text x="118" y="156" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="750" letter-spacing="1">ANANT SINGH</text>
<text x="122" y="211" fill="#93C5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="1.4">FINAL-YEAR COMPUTER SCIENCE STUDENT</text>
<text x="122" y="258" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Full-Stack Development  •  AI Agents  •  Data  •  UI/UX</text>
<text x="122" y="304" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="2">LEARNING  /  BUILDING  /  COLLABORATING</text>
<g transform="translate(1110 190)">
  <circle r="128" fill="none" stroke="#93C5FD" stroke-opacity=".25" stroke-width="2"/>
  <circle r="92" fill="none" stroke="#93C5FD" stroke-opacity=".20" stroke-width="2"/>
  <circle r="55" fill="none" stroke="#93C5FD" stroke-opacity=".16" stroke-width="2"/>
  <g>
    <circle cx="128" cy="0" r="10" fill="#60A5FA"/>
    <circle cx="128" cy="0" r="20" fill="none" stroke="#60A5FA" stroke-opacity=".6">
      <animate attributeName="r" values="12;25;12" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".7;.05;.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="0" cy="-92" r="7" fill="#A78BFA"/>
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/>
  </g>
</g>
<rect x="1055" y="28" width="292" height="38" rx="19" fill="#0B1426" stroke="#60A5FA" stroke-opacity=".45"/>
<circle cx="1080" cy="47" r="6" fill="#4ADE80">
  <animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/>
</circle>
<text x="1098" y="52" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing=".8">OPEN TO INTERNSHIPS &amp; OPPORTUNITIES</text>
</svg>